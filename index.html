<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/about-visual.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/about-visual.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/about-visual.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aven Studio - Creative Studio</title>
    <meta name="description" content="Creative studio crafting impactful brands and websites with strategy, design, code, and marketing — built for modern businesses." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Geist:wght@400;500;600;700&family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --primary: rgb(245, 87, 51);
        --text-primary: rgb(66, 66, 66);
        --text-secondary: rgb(117, 117, 117);
        --bg-light: rgb(252, 252, 252);
        --bg-gray: rgb(242, 242, 242);
      }
      html {
        scroll-behavior: smooth;
        background-color: white;
      }
      body {
        font-family: 'Inter', sans-serif;
        color: var(--text-primary); 
        background-color: white;
        margin: 0;
        padding: 0;
      }
      .font-geist {
        font-family: 'Geist', sans-serif;
      }
      .font-archivo {
        font-family: 'Archivo', sans-serif;
      }
      body {
        background-color: rgb(252, 252, 252);
      }
      @keyframes marquee {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-50%);
        }
      }
      .animate-marquee {
        animation: marquee 30s linear infinite;
      }
      .animate-marquee-slow {
        animation: marquee 60s linear infinite;
      }
      @keyframes marquee-reverse {
        0% {
          transform: translateX(-50%);
        }
        100% {
          transform: translateX(0);
        }
      }
      .animate-marquee-slow-reverse {
        animation: marquee-reverse 60s linear infinite;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
